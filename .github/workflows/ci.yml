name: ci

on:
  push:
    branches:
      - main
      - foundation/snapshot-core
      - feature/rule-engine
  pull_request:

permissions:
  contents: read

env:
  TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore tests/DogfighterAD.Core.Tests/DogfighterAD.Core.Tests.csproj

      - name: Build
        run: dotnet build tests/DogfighterAD.Core.Tests/DogfighterAD.Core.Tests.csproj --configuration Release --no-restore

      - name: Local web UI static asset smoke
        shell: pwsh
        run: |
          $webOutput = Join-Path $PWD 'src/DogfighterAD.Web/bin/Release/net10.0'
          $requiredAssets = @(
            'wwwroot/index.html',
            'wwwroot/app.js',
            'wwwroot/styles.css'
          )
          foreach ($asset in $requiredAssets) {
            $path = Join-Path $webOutput $asset
            if (-not (Test-Path $path -PathType Leaf)) {
              throw "Web UI build output is missing $asset"
            }
          }

          $port = 51839
          $uiDll = Join-Path $webOutput 'dogfighter-ui.dll'
          $ui = Start-Process `
            -FilePath 'dotnet' `
            -ArgumentList @($uiDll, '--no-open', '--port', $port) `
            -NoNewWindow `
            -PassThru
          try {
            $response = $null
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              try {
                $response = Invoke-WebRequest `
                  -Uri "http://127.0.0.1:$port/" `
                  -UseBasicParsing `
                  -TimeoutSec 2
                break
              }
              catch {
                Start-Sleep -Milliseconds 250
              }
            }

            if ($null -eq $response -or $response.StatusCode -ne 200) {
              throw 'Web UI root endpoint did not return HTTP 200.'
            }
            if ($response.Content -notmatch '<title>DogfighterAD</title>') {
              throw 'Web UI root endpoint did not return the expected index page.'
            }
          }
          finally {
            if (-not $ui.HasExited) {
              Stop-Process -Id $ui.Id -Force
            }
          }

      - name: Unit tests
        run: dotnet run --project tests/DogfighterAD.Core.Tests/DogfighterAD.Core.Tests.csproj --configuration Release --no-build

      - name: Offline rule catalog smoke
        run: dotnet run --project src/DogfighterAD.Cli/DogfighterAD.Cli.csproj --configuration Release --no-build -- rules --format json

      - name: Self-contained Windows publish smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP 'dogfighter-win-x64'
          dotnet publish src/DogfighterAD.Cli/DogfighterAD.Cli.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output $publishDir

          $required = @(
            'dogfighter.exe',
            'DogfighterAD.SysvolWorker.exe',
            'DogfighterAD.SysvolWorker.dll',
            'DogfighterAD.SysvolWorker.runtimeconfig.json'
          )
          foreach ($name in $required) {
            $path = Join-Path $publishDir $name
            if (-not (Test-Path $path -PathType Leaf)) {
              throw "Published deployment is missing $name"
            }
          }

          $runtimeConfig = Get-Content `
            (Join-Path $publishDir 'DogfighterAD.SysvolWorker.runtimeconfig.json') `
            -Raw | ConvertFrom-Json
          if (-not $runtimeConfig.runtimeOptions.includedFrameworks) {
            throw 'SYSVOL worker publish is not self-contained.'
          }

          $emptyInput = Join-Path $env:RUNNER_TEMP 'empty-stdin.txt'
          [System.IO.File]::WriteAllBytes($emptyInput, [byte[]]::new(0))
          $worker = Start-Process `
            -FilePath (Join-Path $publishDir 'DogfighterAD.SysvolWorker.exe') `
            -RedirectStandardInput $emptyInput `
            -NoNewWindow `
            -Wait `
            -PassThru
          if ($worker.ExitCode -ne 0) {
            throw "SYSVOL worker exited with code $($worker.ExitCode)."
          }

name: ci

on:
  push:
    branches:
      - main
      - foundation/snapshot-core
  pull_request:

permissions:
  contents: read

env:
  TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore tests/DogfighterAD.Core.Tests/DogfighterAD.Core.Tests.csproj

      - name: Build
        run: dotnet build tests/DogfighterAD.Core.Tests/DogfighterAD.Core.Tests.csproj --configuration Release --no-restore

      - name: Unit tests
        run: dotnet run --project tests/DogfighterAD.Core.Tests/DogfighterAD.Core.Tests.csproj --configuration Release --no-build

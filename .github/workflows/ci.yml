name: ci

on:
  push:
    branches:
      - main
      - foundation/snapshot-core
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/DogfighterAD.Application/DogfighterAD.Application.csproj

      - name: Build
        run: dotnet build src/DogfighterAD.Application/DogfighterAD.Application.csproj --configuration Release --no-restore
